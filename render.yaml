# Render Blueprint for the AEO Audit API (Docker).
# Render dashboard -> New -> Blueprint -> select this repo.
# Variables marked `sync: false` are asked for during setup and never stored in git.
services:
  - type: web
    name: aeo-audit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter # 512 MB. Use "standard" (2 GB) to run several audits at once.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: MONGODB_URI
        sync: false # your Atlas connection string
      - key: CLIENT_ORIGIN
        sync: false # your Vercel URL, e.g. https://audit.youragency.com
      - key: SERVE_CLIENT
        value: "false" # Vercel serves the UI
      - key: TRUST_PROXY
        value: "2"
      - key: MAX_CONCURRENT_AUDITS
        value: "1" # headless Chromium needs the memory; raise on bigger plans
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: SIGNUP_ALLOWLIST
        sync: false # optional, e.g. @youragency.com
      - key: PAGESPEED_API_KEY
        sync: false # optional
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aeo-audit-redis
          property: connectionString
      - key: QUEUE_DRIVER
        value: bullmq # fail loudly if Redis is missing, rather than falling back to in-process
      # AI visibility testing: each assistant is enabled when its key is set (all optional).
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Redis-compatible store for the BullMQ audit queue.
  - type: keyvalue
    name: aeo-audit-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction # BullMQ must never have its job keys evicted
    ipAllowList: [] # reachable only from services in this Render account
